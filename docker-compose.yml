# Só o PostgreSQL roda em contêiner. Os serviços Node rodam com `npm run dev`.
# Motivo: ver docs/03-arquitetura/adr/ADR-011-execucao-local.md
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ponte
      POSTGRES_PASSWORD: ponte
      POSTGRES_DB: postgres
    ports:
      - "5452:5432"
    volumes:
      - ponte-pgdata:/var/lib/postgresql/data
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ponte -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  ponte-pgdata:
